<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산 2박 3일 가족 여행 가이드 (해운대센트럴호텔 기준)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            height: 250px;
        }

        .tab-active {
            background-color: #1e40af;
            color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .step-card:hover {
            border-left: 4px solid #1e40af;
            background-color: #f3f4f6;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="pb-10">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl overflow-hidden">
        <!-- Header -->
        <header class="bg-blue-900 text-white p-6 pt-10">
            <h1 class="text-2xl font-bold mb-1">🌊 부산 가족 여행 스마트 가이드</h1>
            <p class="text-blue-200 text-sm">해운대센트럴호텔 투숙 기준 B안</p>
        </header>

        <!-- Briefing Section -->
        <section class="p-5 border-b border-gray-100">
            <div class="flex items-center space-x-3 mb-4">
                <div class="bg-blue-100 p-2 rounded-full text-blue-800">🏨</div>
                <div>
                    <h2 class="text-sm font-bold">내 숙소 위치</h2>
                    <a href="https://map.naver.com/p/entry/place/1572974776" target="_blank" class="text-xs text-blue-600 underline">해운대센트럴호텔 지도보기</a>
                </div>
            </div>
            
            <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                <p class="text-xs font-bold text-yellow-800 mb-1">📢 여행 핵심 요약</p>
                <ul class="text-[11px] text-yellow-900 space-y-1 list-disc ml-3">
                    <li><b>짐캐리:</b> 부산역 도착 즉시 호텔로 캐리어 배송 (두 손 자유)</li>
                    <li><b>이재모피자:</b> 남포동 도착 즉시 '캐치테이블' 웨이팅 확인 필수</li>
                    <li><b>해변열차:</b> 2일차 16:00 청사포 출발 예약 (15:20 호텔 출발 권장)</li>
                </ul>
            </div>
        </section>

        <!-- Summary Chart Section -->
        <section class="p-5 bg-gray-50">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">여행 밸런스 분석</h3>
            <div class="chart-container">
                <canvas id="travelChart"></canvas>
            </div>
        </section>

        <!-- Tab Navigation -->
        <nav class="flex p-2 bg-gray-100 mx-5 my-4 rounded-xl space-x-1">
            <button onclick="switchDay(1)" id="tab1" class="flex-1 py-2 text-sm rounded-lg transition-all tab-active font-semibold">Day 1</button>
            <button onclick="switchDay(2)" id="tab2" class="flex-1 py-2 text-sm rounded-lg transition-all text-gray-500">Day 2</button>
            <button onclick="switchDay(3)" id="tab3" class="flex-1 py-2 text-sm rounded-lg transition-all text-gray-500">Day 3</button>
        </nav>

        <!-- Main Schedule Content -->
        <main id="schedule-area" class="px-5 space-y-4">
            <!-- JS will inject content here -->
        </main>
    </div>

    <script>
        const travelData = {
            1: {
                title: "남포동 & 영도 1006번 대교 투어",
                desc: "남포동을 먼저 즐기고, 태종대에서 출발하는 '1006번 급행버스'로 부산항대교와 광안대교를 연속 횡단하는 가성비 최고 스릴 코스입니다.",
                items: [
                    { time: "10:30", act: "🧳 짐 배송 접수 (도착 직후)", loc: "짐캐리 부산역 1층", url: "https://map.naver.com/v5/search/%EC%A7%90%EC%BA%AC%EB%A6%AC%20%EB%B6%80%EC%82%B0%EC%97%AD%EC%A0%90" },
                    { time: "10:50", act: "🍲 점심 (본전/신창 등 돼지국밥)", loc: "부산역 인근", url: "https://map.naver.com/v5/search/%EB%B6%80%EC%82%B0%EC%97%AD%20%EB%8F%BC%EC%A7%80%EA%B5%AD%EB%B0%A5" },
                    { time: "12:00", act: "🚇 남포동으로 이동 & 이재모 대기", loc: "자갈치역/남포역", url: "https://map.naver.com/v5/search/%EC%9E%90%EA%B0%88%EC%B9%98%EC%97%AD" },
                    { time: "12:20", act: "🍢 부평깡통시장 구경 (소화시키기)", loc: "부평깡통시장", url: "https://map.naver.com/v5/search/%EB%B6%80%ED%8F%89%EA%B9%A1%ED%86%B5%EC%8B%9C%EC%9E%A5" },
                    { time: "13:30", act: "🍕 늦은 점심: 이재모피자 본점", loc: "이재모피자", url: "https://map.naver.com/v5/search/%EC%9D%B4%EC%9E%AC%EB%AA%A8%ED%94%BC%EC%9E%90%20%EB%B3%B8%EC%A0%90" },
                    { time: "14:40", act: "🚌 태종대로 이동 (8, 30번 버스)", loc: "남포동 출발", url: "https://map.naver.com/p/directions/14362702.5085351,4177579.8654877,%EB%82%A8%ED%8F%AC%EB%8F%99,11400262,PLACE_POI/14369068.7303038,4172421.3789018,%ED%83%9C%EC%A2%85%EB%8C%80%EC%9C%A0%EC%9B%90%EC%A7%80,11571734,PLACE_POI/-/transit?c=13.00,0,0,0,dh" },
                    { time: "15:20", act: "🌲 태종대 관람 (다누비 열차)", loc: "태종대 유원지", url: "https://map.naver.com/v5/search/%ED%83%9C%EC%A2%85%EB%8C%80%EC%9C%A0%EC%9B%90%EC%A7%80" },
                    { time: "17:30", act: "🌉 [하이라이트] 1006번 버스 탑승", loc: "태종대 차고지(종점)", url: "https://map.naver.com/p/directions/14369068.7303038,4172421.3789018,%ED%83%9C%EC%A2%85%EB%8C%80%EC%9C%A0%EC%9B%90%EC%A7%80,11571734,PLACE_POI/14376510.6358327,4185072.0799793,%ED%95%B4%EC%9A%B4%EB%8C%80%EC%84%BC%ED%8A%B8%EB%9F%B4%ED%98%B8%ED%85%94,1572974776,PLACE_POI/-/transit?c=15.00,0,0,0,dh" },
                    { time: "18:40", act: "🚇 숙소 앞 도착 및 체크인", loc: "해운대센트럴호텔", url: "https://map.naver.com/p/entry/place/1572974776" }
                ]
            },
            2: {
                title: "해수욕 & 해변열차 & 야경",
                desc: "오전은 호텔 앞 바다에서 해수욕을 즐기고, 오후에는 청사포의 낭만과 광안리 야경을 만끽합니다.",
                items: [
                    { time: "09:30", act: "🏖️ 해운대 해수욕 즐기기", loc: "호텔 앞 해변", url: "https://map.naver.com/v5/search/%ED%95%B4%EC%9A%B4%EB%8C%80%ED%95%B4%EC%82%AC%EC%9E%A5" },
                    { time: "14:00", act: "🚿 해수욕 마무리 및 샤워", loc: "호텔 복귀", url: "https://map.naver.com/p/entry/place/1572974776" },
                    { time: "15:20", act: "🚌 청사포로 이동 (마을버스/택시)", loc: "호텔 앞 출발", url: "https://map.naver.com/p/directions/14376918.4284523,4185038.9918732,%ED%95%B4%EC%9A%B4%EB%8C%80%EC%84%BC%ED%8A%B8%EB%9F%B4%ED%98%B8%ED%85%94,1572974776,PLACE_POI/14380816.9234851,4184699.2731057,%EC%B2%AD%EC%82%AC%ED%8F%AC%EC%A0%95%EA%B1%B0%EC%9E%A5,1166699299,PLACE_POI/-/transit?c=14.00,0,0,0,dh" },
                    { time: "16:00", act: "🚂 해변열차 탑승 (청사포역)", loc: "청사포 정거장", url: "https://map.naver.com/v5/search/%EC%B2%AD%EC%82%AC%ED%8F%AC%20%EC%A0%95%EA%B1%B0%EC%9E%A5" },
                    { time: "16:40", act: "📸 철도건널목 인증샷", loc: "청사포 건널목", url: "https://map.naver.com/v5/search/%EC%B2%AD%EC%82%AC%ED%8F%AC%20%EA%B1%B4%EB%84%90%EB%목" },
                    { time: "18:30", act: "✨ 광안리 야경 & 저녁", loc: "광안리 해수욕장", url: "https://map.naver.com/v5/search/%EA%B4%91%EC%95%88%EB%A6%AC%ED%95%B4%EC%82%AC%EC%9E%A5" },
                    { time: "20:30", act: "🚇 숙소 복귀", loc: "해운대센트럴호텔", url: "https://map.naver.com/p/entry/place/1572974776" }
                ]
            },
            3: {
                title: "여유로운 마무리",
                desc: "마지막 날은 동백섬 산책으로 마무리하고, 부산역 근처에서 맛있는 식사 후 귀가합니다.",
                items: [
                    { time: "10:00", act: "🏨 체크아웃", loc: "호텔 로비", url: "https://map.naver.com/p/entry/place/1572974776" },
                    { time: "10:30", act: "🚶‍♂️ 동백섬 해안산책", loc: "동백섬", url: "https://map.naver.com/v5/search/%EB%8F%99%EB%B0%B1%EC%84%AC" },
                    { time: "12:30", act: "🥟 점심 (차이나타운 만두)", loc: "초량 차이나타운", url: "https://map.naver.com/v5/search/%EC%B4%88%EB%9F%89%20%EC%B0%A8%EC%9D%B4%EB%82%98%ED%83%80%EC%9A%B4" },
                    { time: "14:00", act: "🚄 KTX 탑승 및 귀가", loc: "부산역", url: "https://map.naver.com/v5/search/%EB%B6%80%EC%82%B0%EC%97%AD" }
                ]
            }
        };

        function switchDay(day) {
            // Update Tab UI
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('tab-active', 'text-gray-500');
                btn.classList.add('text-gray-500');
            });
            const activeTab = document.getElementById(`tab${day}`);
            activeTab.classList.remove('text-gray-500');
            activeTab.classList.add('tab-active');

            // Render Content
            const area = document.getElementById('schedule-area');
            const data = travelData[day];
            
            let html = `
                <div class="mb-2 fade-in">
                    <h4 class="text-lg font-bold text-blue-900">${day}일 차: ${data.title}</h4>
                    <p class="text-xs text-gray-600 mt-1">${data.desc}</p>
                </div>
            `;

            data.items.forEach(item => {
                html += `
                    <div class="flex items-start bg-white p-3 rounded-xl border border-gray-100 shadow-sm step-card fade-in transition-all">
                        <div class="w-12 text-[10px] font-bold text-blue-600 pt-1">${item.time}</div>
                        <div class="flex-1 pl-3 border-l border-blue-50">
                            <div class="text-sm font-semibold">${item.act}</div>
                            <a href="${item.url}" target="_blank" class="text-[10px] text-gray-400 flex items-center mt-1">
                                📍 ${item.loc} <span class="ml-1 text-blue-500 underline">(지도)</span>
                            </a>
                        </div>
                    </div>
                `;
            });

            area.innerHTML = html;
        }

        // Chart Initialization
        function initChart() {
            const ctx = document.getElementById('travelChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['활동/관광', '미식/체험', '해수욕/휴식', '이동'],
                    datasets: [{
                        data: [35, 35, 20, 10],
                        backgroundColor: ['#1e3a8a', '#fbbf24', '#bfdbfe', '#e5e7eb'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                    }
                }
            });
        }

        window.onload = () => {
            switchDay(1);
            initChart();
        };
    </script>
</body>
</html>
